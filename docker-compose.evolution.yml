# Evolution API — a ponte entre o WhatsApp e o n8n.
#
# Não faz parte da aplicação: é a infraestrutura local que conecta o número da
# BBNET. Ficou fora do repositório por muito tempo e o container se perdeu, o
# que custou o passo a passo inteiro — ver docs/integrations/whatsapp-evolution-n8n.md.
#
# Subir:   docker compose -f docker-compose.evolution.yml --env-file .env.evolution up -d
# Derrubar sem perder a sessão:  docker compose -f docker-compose.evolution.yml down
# Derrubar apagando tudo:        docker compose -f docker-compose.evolution.yml down -v
#
# ⚠️ `down -v` apaga o volume das instâncias, e com ele a sessão do WhatsApp.
# Depois disso o QR precisa ser escaneado de novo.

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    # Só na interface local: a Evolution não deve ficar exposta na rede.
    # A porta de fora é configurável porque a 8080 costuma estar ocupada — nesta
    # máquina tem um Apache nela. A de dentro é sempre 8080.
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8081}:8080"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      # É aqui que mora a sessão do WhatsApp. Perder este volume = escanear o QR de novo.
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    # Sem healthcheck a API sobe antes do banco aceitar conexão e morre com P1001.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 12

  evolution-redis:
    image: redis:latest
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
